#
# wifipubauth — SMS envoyé avec un voucher OPNsense. Fichier par défaut,
# remplacé à chaque mise à jour.
# Personnalisation : /etc/wifipubauth/templates.d/opnsense-sms.conf, prioritaire.
# Format : Message.LANGUE "texte". Langue : Language, sinon langue du système.
# Repères : {identifiant}, {mot_de_passe} (obligatoires), {validite_heures}.

Message.fr-FR "Code Wi-Fi valable {validite_heures} h : identifiant {identifiant}, mot de passe {mot_de_passe}"
Message.en-US "Wi-Fi code valid for {validite_heures} h: username {identifiant}, password {mot_de_passe}"
