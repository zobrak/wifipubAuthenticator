#
# wifipubauth — SMS envoyé avec un voucher OPNsense. Fichier par défaut,
# remplacé à chaque mise à jour.
# Personnalisation : /etc/wifipubauth/templates.d/opnsense-sms.conf, prioritaire.
# Format : Message.LANGUE "texte". Langue : Language, sinon langue du système.
# Repères : {identifiant}, {mot_de_passe} (obligatoires), {validite_heures}.
# Forme mot_de_passe-identifiant : celle attendue par la page de portail livrée
# (portail/opnsense/index.html).

Message.fr-FR "Wi-Fi : code d'accès valable {validite_heures} h, à coller sur la page de connexion : {mot_de_passe}-{identifiant}"
Message.en-US "Wi-Fi: access code valid for {validite_heures} h, paste it on the login page: {mot_de_passe}-{identifiant}"
