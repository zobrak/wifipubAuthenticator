#
# wifipubauth — paramètres d'installation, lus par install.sh.
# Lignes sans # : obligatoires, à compléter (« MotClé valeur »).
# Lignes en # : valeur par défaut ; pour la changer, retirer le # et la modifier.
# Secrets : pas ici, install.sh les demande.
# Après installation : renommé install.conf.old.
# Détail des paramètres : wifipubauth.conf.example.
# Aide : https://github.com/zobrak/wifibpub

# --- FreeRADIUS --------------------------------------------------------------

# Adresse d'écoute de FreeRADIUS (adresse IP de cette machine vue du portail).
RadiusListenAddress

# Adresse IP d'où le portail captif envoie ses requêtes RADIUS.
RadiusClientAddress

# --- Service -----------------------------------------------------------------

#ListenAddress 127.0.0.1
#ListenPort 8642
#Channels sms
#RequestMarker demande
# Défaut : langue du système.
#Language fr-FR
#Pseudonymization off

# --- Vouchers ----------------------------------------------------------------

# Fournisseur. Disponible : opnsense.
VoucherApiProvider

# opnsense : adresse de l'API.
OpnsenseUrl

# opnsense : clé de l'API.
OpnsenseApiKey

#OpnsenseVoucherServer wifipubauth
#VoucherGroup sms
#VoucherValidity 12h
#VoucherExpiry 1h

# --- SMS ---------------------------------------------------------------------

# Fournisseur. Disponible : ovh.
SmsApiProvider

# ovh : compte SMS.
OvhSmsAccount

# ovh : utilisateur SMS.
OvhSmsLogin

# ovh : expéditeur.
OvhSmsSender

#OvhSmsUrl https://www.ovh.com/cgi-bin/sms/http2sms.cgi

# --- Limites -----------------------------------------------------------------

#LimitPerIdentifier 2/24h
#LimitPerMac 3/1h
#LimitGlobal 10/24h
#HttpTimeout 10s
