#
# Serveur virtuel FreeRADIUS de @NOM@ — modèle.
#
# Il ne reçoit que le portail captif, n'accepte jamais personne et ne transmet
# au service que les demandes bien formées. L'accès est ouvert par le voucher,
# vérifié par le portail captif.
#
# install.sh crée sites-available/@NOM@ à partir de ce modèle lors de la
# première installation (install.conf : RadiusListenAddress, RadiusClientAddress ;
# secret partagé généré), puis ne le modifie plus.
#
# Aide et signalement de bugs : https://github.com/zobrak/wifibpub

server @NOM@ {
	# Authentification seule, sur l'adresse de cette machine vue du portail.
	listen {
		type = auth
		ipaddr = ADRESSE_ECOUTE
		port = 1812
	}

	# Seul client admis : le portail captif. Les clients globaux (clients.conf)
	# ne s'appliquent pas à ce serveur. Message-Authenticator exigé (BlastRADIUS).
	client portail {
		ipaddr = ADRESSE_PORTAIL
		secret = "SECRET_RADIUS"
		require_message_authenticator = yes
		nas_type = other
	}

	authorize {
		# Premier niveau de validation : identifiant et mot de passe présents,
		# identifiant au format mobile français 06/07 (espaces ou points admis)
		# ou adresse e-mail. Tout le reste est refusé sans aller plus loin.
		# Le mot de passe (marqueur de demande) est vérifié par le service.
		if (!&User-Name || !&User-Password) {
			reject
		}
		if ((&User-Name !~ /^0[67]([ .]?[0-9]){8}$/) && \
		    (&User-Name !~ /^[A-Za-z0-9._%%+-]{1,64}@[A-Za-z0-9-]{1,63}(\.[A-Za-z0-9-]{1,63})*\.[A-Za-z]{2,63}$/)) {
			reject
		}

		# Second niveau : le service (module rest), qui refuse toujours.
		@NOM@

		reject
	}

	authenticate {
	}
}
