#
# Module rest de FreeRADIUS pour @NOM@ — fourni et mis à jour par install.sh,
# ne pas le modifier. Adresse et port : ceux du service (ListenAddress,
# ListenPort), relus à chaque passage d'install.sh.
# Transmet chaque demande au service local, en JSON. Le service répond
# toujours 401 : rlm_rest en fait « reject ». Il ne sert qu'à déclencher,
# en tâche de fond, la création d'un voucher et son envoi par SMS.
# Version et historique : VERSION et CHANGELOG.md du projet.

rest @NOM@ {
	# Adresse de base, utilisée aussi pour les connexions tenues en réserve.
	connect_uri = "http://@APP_ADRESSE@:@APP_PORT@"

	authorize {
		uri = "http://@APP_ADRESSE@:@APP_PORT@/demande"
		method = 'post'
		body = 'json'
		# Le service répond tout de suite ; au-delà, la demande est refusée.
		timeout = 4.0
	}
}
